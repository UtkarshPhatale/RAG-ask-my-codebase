[pytest]
# corpus_repos/ holds full copies of the repos we ingest as data. Some contain
# their own test_*.py scripts that execute heavy code at import time, so bare
# `pytest` must never collect them.
testpaths = tests
norecursedirs = corpus_repos venv .git logs
markers =
    live_llm: makes real Anthropic API calls (costs tokens, needs ANTHROPIC_API_KEY)